name: grokbot
services:
  host:
    image: ${GROKBOT_HOST_IMAGE:-grokbot-host:local}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    ports:
      - "${GROKBOT_LISTEN_ADDRESS:-127.0.0.1}:${GROKBOT_PUBLIC_PORT:-18080}:8000"
    environment:
      GROKBOT_PUBLIC_URL: ${GROKBOT_PUBLIC_URL:-}
      GROKBOT_BOX_HOST: box
      GROKBOT_VNC_URL: http://box:6080
      GROKBOT_FORK_VNC_URL: http://box:6081
      TZ: ${TZ:-Asia/Singapore}
    volumes:
      - host-data:/data
    depends_on:
      - box
    stop_grace_period: 25s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  box:
    image: ${GROKBOT_BOX_IMAGE:-grokbot-box-input:9d2ac1b}
    platform: linux/amd64
    restart: unless-stopped
    shm_size: 1gb
    volumes:
      - box-home:/home/box
      - box-workspace:/workspace
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  host-data:
  box-home:
  box-workspace:
