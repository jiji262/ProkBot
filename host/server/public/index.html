<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ProkBot</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/components.css" />
    <link rel="stylesheet" href="/shell.css" />
    <link rel="stylesheet" href="/pages.css" />
    <link rel="stylesheet" href="/stage.css" />
    <script src="/theme.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="loading" class="loading" role="status">正在连接 Host…</div>
    <div id="auth-screen" class="auth theme-dark" hidden>
      <header class="auth-top">
        <span class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="brand-face" width="32" height="32" rx="9"/><rect class="brand-eye" x="9.6" y="11" width="4.4" height="10.5" rx="2.2" transform="rotate(-28 11.8 16.25)"/><rect class="brand-eye" x="18.4" y="9.5" width="4.4" height="8.5" rx="2.2" transform="rotate(-28 20.6 13.75)"/></svg><span>ProkBot <small>Host</small></span></span>
      </header>
      <form id="auth-form" class="auth-talk">
        <h1 id="auth-title" class="sr-only">登录 Host</h1>
        <p id="auth-error" class="auth-bubble" role="alert" hidden></p>
        <label id="setup-key-label" class="composer" hidden><span class="sr-only">初始化密钥</span><input id="setup-key" name="setupKey" autocomplete="off" spellcheck="false" placeholder="初始化密钥" /></label>
        <div class="composer">
          <label class="sr-only" for="auth-password">管理员密码</label>
          <input id="auth-password" type="password" name="password" autocomplete="current-password" minlength="12" maxlength="128" required placeholder="管理员密码" />
          <button id="auth-submit" class="send-btn icon-btn" type="submit" aria-label="登录"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </div>
      </form>
      <div id="auth-face" class="auth-horizon"></div>
    </div>
    <div id="console" class="shell" hidden>
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">
          <a class="brand" href="/" data-view="overview"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="brand-face" width="32" height="32" rx="9"/><rect class="brand-eye" x="9.6" y="11" width="4.4" height="10.5" rx="2.2" transform="rotate(-28 11.8 16.25)"/><rect class="brand-eye" x="18.4" y="9.5" width="4.4" height="8.5" rx="2.2" transform="rotate(-28 20.6 13.75)"/></svg><span>ProkBot <small>Host</small></span></a>
          <button id="nav-toggle" class="icon-btn nav-toggle" type="button" aria-label="菜单" aria-expanded="false"></button>
        </div>
        <nav id="nav" class="nav" aria-label="管理导航"></nav>
        <div class="sidebar-foot">
          <button id="account" class="nav-item account" type="button" data-view="general">
            <span id="account-avatar" class="avatar" data-private></span>
            <span class="account-copy"><strong id="account-name" data-private></strong><span id="header-health" class="status" role="status">正在检查</span></span>
          </button>
          <button id="privacy-toggle" class="icon-btn" type="button" aria-label="隐藏敏感信息"></button>
        </div>
      </aside>
      <main id="main" class="main">
        <section data-panel="overview" class="page overview"></section>
        <section data-panel="general" class="page" hidden></section>
        <section data-panel="model" class="page" hidden></section>
        <section data-panel="speech" class="page" hidden></section>
        <section data-panel="media" class="page" hidden></section>
        <section data-panel="web-services" class="page" hidden></section>
        <section data-panel="harness" class="page" hidden></section>
        <section data-panel="skills" class="page" hidden></section>
        <section data-panel="apps" class="page" hidden></section>
        <section data-panel="prompts" class="page wide" hidden></section>
        <section data-panel="devices" class="page" hidden></section>
        <section data-panel="network" class="page" hidden></section>
        <section data-panel="execution" class="page" hidden></section>
        <section data-panel="federation" class="page" hidden></section>
        <section data-panel="webhooks" class="page" hidden></section>
        <section data-panel="sharing" class="page" hidden></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
